[tools]
ruff = "0.17.1"
shellcheck = "0.11.0"

[tasks.lint]
description = "Run ruff on bootstrap.py and shellcheck on stub.sh"
run = [
  "ruff check bootstrap.py",
  "ruff format --check bootstrap.py",
  "bash -n stub.sh",
  "shellcheck -s bash stub.sh",
]

[tasks.sign]
description = "Sign bootstrap.py with CLAUDE_ENV_SIGNING_KEY from fnox, then run check"
shell = "bash -c"
run = '''
set -euo pipefail
key=$(mktemp)
trap 'rm -f "$key"' EXIT
fnox get CLAUDE_ENV_SIGNING_KEY > "$key"
rm -f bootstrap.py.sig
ssh-keygen -Y sign -f "$key" -n claude-env bootstrap.py
mise run check
'''

[tasks.check]
description = "Lint, then confirm bootstrap.py.sig matches bootstrap.py and signing_key.pub"
depends = ["lint"]
shell = "bash -c"
run = '''
set -euo pipefail
signers=$(mktemp)
trap 'rm -f "$signers"' EXIT
echo "claude-env $(cat signing_key.pub)" > "$signers"
ssh-keygen -Y verify -f "$signers" -I claude-env -n claude-env -s bootstrap.py.sig < bootstrap.py ||
  { echo "bootstrap.py: missing or stale signature, run mise run sign" >&2; exit 1; }
'''
