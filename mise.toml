[tools]
ruff = "0.17.1"
shellcheck = "0.11.0"

[tasks.lint]
description = "Run ruff on bootstrap.py and shellcheck on stub.sh"
run = [
  "ruff check bootstrap.py",
  "ruff format --check bootstrap.py",
  "bash -n stub.sh",
  "shellcheck -s bash stub.sh",
]

[tasks.sign]
description = "Sign bootstrap.py with CLAUDE_ENV_SIGNING_KEY from fnox, then run check"
shell = "bash -c"
run = '''
set -euo pipefail
key=$(mktemp)
trap 'rm -f "$key"' EXIT
fnox get CLAUDE_ENV_SIGNING_KEY > "$key"
rm -f bootstrap.py.sig
ssh-keygen -Y sign -f "$key" -n claude-env bootstrap.py
mise run check
'''

[tasks.check]
description = "Lint, then confirm bootstrap.py.sig matches bootstrap.py and signing_key.pub"
depends = ["lint"]
shell = "bash -c"
run = '''
set -euo pipefail
signers=$(mktemp)
trap 'rm -f "$signers"' EXIT
echo "claude-env $(cat signing_key.pub)" > "$signers"
ssh-keygen -Y verify -f "$signers" -I claude-env -n claude-env -s bootstrap.py.sig < bootstrap.py ||
  { echo "bootstrap.py: missing or stale signature, run mise run sign" >&2; exit 1; }
'''

[tasks.precommit]
description = "Lint, then confirm the staged bootstrap.py.sig matches the staged bootstrap.py"
depends = ["lint"]
shell = "bash -c"
run = '''
set -euo pipefail
dir=$(mktemp -d)
trap 'rm -rf "$dir"' EXIT
echo "claude-env $(cat signing_key.pub)" > "$dir/allowed_signers"
git show :bootstrap.py > "$dir/bootstrap.py"
git show :bootstrap.py.sig > "$dir/bootstrap.py.sig" 2> /dev/null || true
ssh-keygen -Y verify -f "$dir/allowed_signers" -I claude-env -n claude-env \
  -s "$dir/bootstrap.py.sig" < "$dir/bootstrap.py" ||
  { echo "staged bootstrap.py: missing or stale signature, run mise run sign and stage bootstrap.py.sig" >&2; exit 1; }
'''

[tasks.install-hooks]
description = "Install the git pre-commit hook that runs mise run precommit"
run = "mise generate git-pre-commit --write --task=precommit"
