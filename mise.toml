[tools]
ruff = "0.17.1"
shellcheck = "0.11.0"

[tasks.build]
description = "Compile src/cloud_env into bootstrap.py"
run = "python3 -B scripts/build.py"

[tasks.lint]
description = "Run ruff on Python sources and shellcheck on stub*.sh"
run = [
  "ruff check src scripts tests bootstrap.py",
  "ruff format --check src scripts tests bootstrap.py",
  "bash -n stub.sh stub-agy.sh",
  "shellcheck -s bash stub.sh stub-agy.sh",
]

[tasks.test]
description = "Run unit and bundle parity tests"
run = "PYTHONPATH=src python3 -B -m unittest discover -s tests"

[tasks.sign]
description = "Build and sign bootstrap.py with CLAUDE_ENV_SIGNING_KEY from fnox, then run check"
depends = ["build"]
shell = "bash -c"
run = '''
set -euo pipefail
key=$(mktemp)
trap 'rm -f "$key"' EXIT
fnox get CLAUDE_ENV_SIGNING_KEY > "$key"
rm -f bootstrap.py.sig
ssh-keygen -Y sign -f "$key" -n claude-env bootstrap.py
mise run check
'''

[tasks.check]
description = "Lint, test, verify bootstrap.py matches src/cloud_env, and verify bootstrap.py.sig"
depends = ["lint", "test"]
shell = "bash -c"
run = '''
set -euo pipefail
python3 -B scripts/build.py --check
signers=$(mktemp)
trap 'rm -f "$signers"' EXIT
echo "claude-env $(cat signing_key.pub)" > "$signers"
ssh-keygen -Y verify -f "$signers" -I claude-env -n claude-env -s bootstrap.py.sig < bootstrap.py ||
  { echo "bootstrap.py: missing or stale signature, run mise run sign" >&2; exit 1; }
'''

[tasks.precommit]
description = "Lint, test, and confirm staged bootstrap.py and bootstrap.py.sig match staged sources"
shell = "bash -c"
run = '''
set -euo pipefail
dir=$(mktemp -d)
trap 'rm -rf "$dir"' EXIT
git checkout-index --all --prefix="$dir/"
(
  cd "$dir"
  ruff check src scripts tests bootstrap.py
  ruff format --check src scripts tests bootstrap.py
  bash -n stub.sh stub-agy.sh
  shellcheck -s bash stub.sh stub-agy.sh
  PYTHONPATH=src python3 -B -m unittest discover -s tests
  python3 -B scripts/build.py --check --root "$dir"
)
echo "claude-env $(cat "$dir/signing_key.pub")" > "$dir/allowed_signers"
ssh-keygen -Y verify -f "$dir/allowed_signers" -I claude-env -n claude-env \
  -s "$dir/bootstrap.py.sig" < "$dir/bootstrap.py" ||
  { echo "staged bootstrap.py: missing or stale signature, run mise run sign and stage bootstrap.py.sig" >&2; exit 1; }
'''

[tasks.install-hooks]
description = "Install the git pre-commit hook that runs mise run precommit"
run = "mise generate git-pre-commit --write --task=precommit"
